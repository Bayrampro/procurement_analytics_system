name: Build Windows Installer

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build Windows app
        run: flutter build windows --release

      - name: Download and install Inno Setup
        run: |
          $innosetupUrl = "https://jrsoftware.org/download.php/is.exe"
          $innosetupPath = "$env:TEMP\innosetup.exe"
          Write-Host "Downloading Inno Setup..."
          Invoke-WebRequest -Uri $innosetupUrl -OutFile $innosetupPath
          Write-Host "Installing Inno Setup..."
          Start-Process -FilePath $innosetupPath -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-" -Wait
          Start-Sleep -Seconds 10

      - name: Build installer with Inno Setup
        run: |
          $innoSetupPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $innoSetupPath)) {
            Write-Host "Inno Setup not found at $innoSetupPath, trying alternative path..."
            $innoSetupPath = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          if (Test-Path $innoSetupPath) {
            Write-Host "Building installer with Inno Setup..."
            & $innoSetupPath "installer.iss"
          } else {
            Write-Host "Error: Inno Setup not found. Searching..."
            $found = Get-ChildItem "C:\Program Files*" -Recurse -Filter "ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) {
              Write-Host "Found at: $($found.FullName)"
              & $found.FullName "installer.iss"
            } else {
              Write-Host "Inno Setup not found. Please check installation."
              exit 1
            }
          }

      - name: Check installer file
        run: |
          if (Test-Path "installer\*.exe") {
            Get-ChildItem "installer\*.exe" | ForEach-Object {
              Write-Host "Installer created: $($_.Name) ($([math]::Round($_.Length / 1MB, 2)) MB)"
            }
          } else {
            Write-Host "Error: Installer file not found!"
            exit 1
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installer/*.exe
          retention-days: 30

      - name: Create Release (if tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: installer/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
