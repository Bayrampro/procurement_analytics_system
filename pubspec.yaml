name: procurement_analytics_system
description: "Информационная система для анализа торговых площадок в сфере закупок"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  drift: ^2.30.0
  path_provider: ^2.1.1
  csv: ^6.0.0
  fl_chart: ^0.66.0
  file_picker: ^8.1.2
  intl: ^0.19.0
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.30.0
  build_runner: ^2.4.7
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/procurements_source.csv
    - assets/logo.png
    - assets/icon.png

  fonts:
    - family: RussoOne
      fonts:
        - asset: fonts/RussoOne-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: true
  windows:
    generate: true
    image_path: "assets/icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icon.png"
  web:
    generate: true
  linux:
    generate: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#6366F1"
  adaptive_icon_foreground: "assets/icon.png"
