name: Build macOS Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build macOS app (Release)
        run: flutter build macos --release

      - name: Remove quarantine attribute
        run: |
          xattr -cr build/macos/Build/Products/Release/procurement_analytics_system.app || true

      - name: Ad-hoc code sign (deep)
        run: |
          APP_PATH="build/macos/Build/Products/Release/procurement_analytics_system.app"
          
          # Удаляем старые подписи
          codesign --remove-signature "$APP_PATH" || true
          
          # Подписываем все вложенные фреймворки и библиотеки (сначала вложенные компоненты)
          find "$APP_PATH" -type f \( -name "*.dylib" -o -name "*.so" \) -exec codesign --force --sign - --timestamp=none {} \; || true
          
          find "$APP_PATH" -type d -name "*.framework" | while read framework; do
            codesign --force --sign - --timestamp=none "$framework" || true
          done
          
          # Подписываем плагины
          find "$APP_PATH/Contents/Frameworks" -type d -name "*.app" -exec codesign --force --sign - --timestamp=none {} \; || true
          
          # Подписываем само приложение с правильными опциями
          codesign --force --deep --sign - \
            --timestamp=none \
            --options runtime \
            --entitlements macos/Runner/Release.entitlements \
            "$APP_PATH"

      - name: Verify code signature
        run: |
          APP_PATH="build/macos/Build/Products/Release/procurement_analytics_system.app"
          codesign --verify --verbose --deep --strict "$APP_PATH"
          
          # Показываем информацию о подписи
          codesign -dvv "$APP_PATH" || true

      - name: Create first-run script
        run: |
          cat > build/macos/Build/Products/Release/FirstRun.command << 'EOF'
          #!/bin/bash
          # Скрипт для первого запуска приложения на macOS
          
          APP_NAME="procurement_analytics_system.app"
          SCRIPT_DIR="$( cd "$( dirname "${BASH_SOURCE[0]}" )" && pwd )"
          APP_PATH="$SCRIPT_DIR/$APP_NAME"
          
          echo "🔓 Настройка приложения для первого запуска..."
          
          # Удаляем quarantine атрибут
          echo "Удаление quarantine атрибута..."
          xattr -cr "$APP_PATH"
          
          # Разрешаем запуск через spctl (требует пароль администратора)
          echo "Разрешение запуска приложения..."
          sudo spctl --master-disable 2>/dev/null || echo "Не удалось отключить Gatekeeper (это нормально)"
          
          echo ""
          echo "✅ Готово! Теперь можно запустить приложение:"
          echo "   open \"$APP_PATH\""
          echo ""
          echo "Или просто дважды кликните на $APP_NAME"
          echo ""
          read -p "Нажмите Enter для запуска приложения..."
          open "$APP_PATH"
          EOF
          
          chmod +x build/macos/Build/Products/Release/FirstRun.command

      - name: Create ZIP archive
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../procurement_analytics_system-macos.zip \
            procurement_analytics_system.app \
            FirstRun.command
          
          # Создаем README с инструкциями
          cat > ../../../../README_MACOS.txt << 'EOF'
          ============================================
          Procurement Analytics System для macOS
          ============================================
          
          ИНСТРУКЦИЯ ПО УСТАНОВКЕ:
          
          1. Распакуйте архив
          2. Запустите FirstRun.command (двойной клик)
             - Введите пароль администратора при запросе
             - Это разрешит запуск приложения
          3. После этого запустите procurement_analytics_system.app
          
          АЛЬТЕРНАТИВНЫЙ СПОСОБ (без скрипта):
          
          Если не хотите запускать скрипт, выполните в Terminal:
          
          cd /path/to/extracted/folder
          xattr -cr procurement_analytics_system.app
          open procurement_analytics_system.app
          
          При первом запуске:
          - Откройте "Системные настройки" → "Безопасность и конфиденциальность"
          - Нажмите "Открыть в любом случае" рядом с предупреждением
          
          ============================================
          EOF
          
          zip -j ../../../../procurement_analytics_system-macos.zip \
            ../../../../README_MACOS.txt

      - name: Create DMG (optional)
        run: |
          # Install create-dmg if not available
          if ! command -v create-dmg &> /dev/null; then
            brew install create-dmg || echo "create-dmg not available, skipping DMG creation"
          fi
          
          if command -v create-dmg &> /dev/null; then
            create-dmg \
              --volname "Procurement Analytics System" \
              --window-pos 200 120 \
              --window-size 800 400 \
              --icon-size 100 \
              --icon "procurement_analytics_system.app" 200 190 \
              --hide-extension "procurement_analytics_system.app" \
              --app-drop-link 600 185 \
              "procurement_analytics_system-macos.dmg" \
              "build/macos/Build/Products/Release/" || echo "DMG creation failed, continuing..."
          fi

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: |
            build/macos/Build/Products/Release/procurement_analytics_system.app
            build/macos/Build/Products/Release/FirstRun.command
            procurement_analytics_system-macos.zip
            README_MACOS.txt
          retention-days: 30

      - name: Upload DMG artifact (if exists)
        if: hashFiles('procurement_analytics_system-macos.dmg') != ''
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: procurement_analytics_system-macos.dmg
          retention-days: 30

      - name: Create Release (if tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/macos/Build/Products/Release/procurement_analytics_system.app
            procurement_analytics_system-macos.zip
            procurement_analytics_system-macos.dmg
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
